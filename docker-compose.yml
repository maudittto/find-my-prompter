services:
  postgres:
    image: postgres:18
    container_name: findmyprompter-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: findmyprompter
      POSTGRES_USER: findmyprompter
      POSTGRES_PASSWORD: findmyprompter
    ports:
      - "5432:5432"
    volumes:
      - findmyprompter_postgres_data:/var/lib/postgresql

volumes:
  findmyprompter_postgres_data:
