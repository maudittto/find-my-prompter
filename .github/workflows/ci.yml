name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: findmyprompter_tests
          POSTGRES_USER: findmyprompter
          POSTGRES_PASSWORD: findmyprompter
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - run: dotnet build backend/FindMyPrompter.slnx --configuration Release
      - run: dotnet test backend/FindMyPrompter.slnx --configuration Release --no-build
        env:
          ConnectionStrings__Database: Host=localhost;Port=5432;Database=findmyprompter_tests;Username=findmyprompter;Password=findmyprompter

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
